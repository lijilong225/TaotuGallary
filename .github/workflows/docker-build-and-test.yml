name: Docker Build and Test

permissions:
  contents: write
  packages: write

on:
  workflow_dispatch: {}
  push:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      REGISTRY: ghcr.io
      IMAGE_NAME: ${{ github.repository }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Set lowercase image name
        run: |
          echo "IMAGE_NAME_LOWER=${IMAGE_NAME,,}" >> $GITHUB_ENV
        shell: bash

      - name: Determine next image version
        id: version
        run: |
          LATEST=$(git tag -l 'v[0-9]*' | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | sort -V | tail -n1 || true)
          if [ -z "$LATEST" ]; then
            NEXT="0.0.1"
          else
            IFS='.' read -r MAJOR MINOR PATCH <<< "${LATEST#v}"
            PATCH=$((PATCH + 1))
            NEXT="$MAJOR.$MINOR.$PATCH"
          fi
          echo "IMAGE_TAG=$NEXT" >> "$GITHUB_ENV"
          echo "IMAGE_VERSION=v$NEXT" >> "$GITHUB_ENV"
          echo "Next image version: $NEXT"
        shell: bash

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build image
        run: docker build -t gallery-manager:ci .

      - name: Prepare gallery dir
        run: mkdir -p gallery

      - name: Run container
        run: |
          docker run -d --rm --name gallery-manager-test -p 8080:8080 \
            -v "$GITHUB_WORKSPACE/gallery":/gallery \
            -v gallery-data:/app/data \
            gallery-manager:ci

      - name: Wait for server
        run: |
          for i in {1..30}; do
            if curl -sS http://localhost:8080/api/ping >/dev/null 2>&1; then
              echo "server ready"; break
            fi
            sleep 1
          done

      - name: Show container logs
        run: docker logs --tail 200 gallery-manager-test || true

      - name: Ping endpoint
        run: curl -v http://localhost:8080/api/ping

      - name: Stop container
        if: always()
        run: |
          docker stop gallery-manager-test || true

      - name: Login to GitHub Container Registry
        if: github.ref == 'refs/heads/main'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image to GHCR
        if: github.ref == 'refs/heads/main'
        uses: docker/build-push-action@v6
        with:
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME_LOWER }}:ci
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME_LOWER }}:latest
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME_LOWER }}:${{ env.IMAGE_TAG }}
          build-args: |
            BUILDKIT_INLINE_CACHE=1

      - name: Push version tag
        if: github.ref == 'refs/heads/main'
        run: |
          git tag ${{ env.IMAGE_VERSION }}
          git push origin ${{ env.IMAGE_VERSION }}
