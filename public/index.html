<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>套图管理器</title>
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>
  <div id="login-view" class="login-view hidden">
    <div class="login-box">
      <h1>套图管理器</h1>
      <form id="login-form">
        <div class="field">
          <label>用户名</label>
          <input type="text" id="username" autocomplete="username" required>
        </div>
        <div class="field">
          <label>密码</label>
          <input type="password" id="password" autocomplete="current-password" required>
        </div>
        <div id="login-error" class="error hidden"></div>
        <button type="submit" class="btn-primary">登 录</button>
      </form>
    </div>
  </div>

  <div id="main-view" class="main-view hidden">
    <header class="topbar">
      <div class="brand">套图管理器</div>
      <div class="topbar-right">
        <span id="current-user" class="user"></span>
        <button id="btn-change-password" class="btn-ghost">修改密码</button>
        <button id="btn-logout" class="btn-ghost">退出登录</button>
      </div>
    </header>

    <div class="layout">
      <aside class="sidebar">
        <div class="sidebar-title">目录</div>
        <div id="tree" class="tree"></div>
      </aside>

      <section class="content">
        <div class="breadcrumb" id="breadcrumb"></div>
        <div class="sortbar hidden" id="sortbar">
          <label>排序：</label>
          <select id="sort-by">
            <option value="name">文件名</option>
            <option value="time">创建时间</option>
          </select>
          <select id="sort-order">
            <option value="asc">正序</option>
            <option value="desc">倒序</option>
          </select>
        </div>
        <div id="browse-area" class="browse-area">
          <div id="empty-tip" class="empty hidden">请选择左侧目录，或点击套图浏览图片</div>
          <div id="folder-grid" class="folder-grid"></div>
          <div id="archive-grid" class="folder-grid archive-grid"></div>
          <div id="image-grid" class="image-grid"></div>
        </div>
      </section>
    </div>
  </div>

  <div id="lightbox" class="lightbox hidden">
    <div class="lightbox-toolbar">
      <button id="lb-prev" class="lb-btn" title="上一个">&#10094;</button>
      <span id="lb-counter" class="lb-counter"></span>
      <button id="lb-next" class="lb-btn" title="下一个">&#10095;</button>
      <button id="lb-close" class="lb-btn" title="关闭">&#10005;</button>
    </div>
    <div class="lightbox-stage">
      <img id="lb-img" alt="">
      <div id="lb-video-wrap" class="video-wrap hidden">
        <video id="lb-video" playsinline></video>
        <div class="video-controls">
          <button id="vc-play" class="vc-btn" title="播放/暂停">&#10074;&#10074;</button>
          <input type="range" id="vc-progress" min="0" max="1000" value="0" step="1" title="进度">
          <span id="vc-time" class="vc-time">0:00 / 0:00</span>
          <button id="vc-mute" class="vc-btn" title="静音">&#128266;</button>
          <input type="range" id="vc-volume" min="0" max="100" value="100" step="1" title="音量">
          <button id="vc-pip" class="vc-btn" title="小窗画中画">&#10697;</button>
          <button id="vc-fullscreen" class="vc-btn" title="浏览器全屏">&#9974;</button>
          <button id="vc-close" class="vc-btn" title="关闭">&#10005;</button>
        </div>
      </div>
    </div>
  </div>

  <div id="pwd-modal" class="modal hidden">
    <div class="modal-mask"></div>
    <div class="modal-box">
      <h2>修改密码</h2>
      <form id="pwd-form">
        <div class="field">
          <label>当前密码</label>
          <input type="password" id="pwd-old" autocomplete="current-password" required>
        </div>
        <div class="field">
          <label>新密码</label>
          <input type="password" id="pwd-new" autocomplete="new-password" required>
        </div>
        <div class="field">
          <label>确认新密码</label>
          <input type="password" id="pwd-confirm" autocomplete="new-password" required>
        </div>
        <div id="pwd-error" class="error hidden"></div>
        <div class="modal-actions">
          <button type="button" id="pwd-cancel" class="btn-ghost">取消</button>
          <button type="submit" class="btn-primary modal-submit">确认修改</button>
        </div>
      </form>
    </div>
  </div>

  <script src="/js/app.js"></script>
</body>
</html>
