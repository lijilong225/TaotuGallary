<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>套图管理器</title>
  <link rel="stylesheet" href="/css/style.css?v=20260816s">
  <script src="/js/icons.js?v=20260816s"></script>
</head>
<body>
  <div id="login-view" class="login-view hidden">
    <div class="login-box">
      <h1>套图管理器</h1>
      <form id="login-form">
        <div class="field">
          <label>用户名</label>
          <input type="text" id="username" autocomplete="username" required>
        </div>
        <div class="field">
          <label>密码</label>
          <input type="password" id="password" autocomplete="current-password" required>
        </div>
        <div id="login-error" class="error hidden"></div>
        <button type="submit" class="btn-primary">登 录</button>
      </form>
    </div>
  </div>

  <div id="main-view" class="main-view hidden">
    <header class="topbar">
      <div class="brand">套图管理器</div>
      <div class="topbar-right">
        <div class="user-menu" id="user-menu">
          <button id="current-user" class="user user-btn"></button>
          <div id="user-dropdown" class="user-dropdown hidden">
            <div class="dropdown-item dd-title">账户信息</div>
            <button type="button" class="dropdown-item dd-action" id="dd-favorites" data-icon="heart">打开收藏</button>
          </div>
        </div>
        <button id="btn-logout" class="btn-ghost">退出登录</button>
      </div>
    </header>

    <div class="layout">
      <aside class="sidebar">
        <div class="sidebar-title">目录</div>
        <div id="tree" class="tree"></div>
      </aside>

      <section class="content">
        <div class="breadcrumb" id="breadcrumb"></div>
        <div class="sortbar hidden" id="sortbar">
          <label>排序：</label>
          <select id="sort-by">
            <option value="time" selected>修改时间</option>
            <option value="name">文件名</option>
          </select>
          <select id="sort-order">
            <option value="desc" selected>倒序</option>
            <option value="asc">正序</option>
          </select>
          <select id="time-group" class="time-group">
            <option value="day" selected>按天</option>
            <option value="month">按月</option>
            <option value="year">按年</option>
          </select>
          <div id="thumb-size-group" class="thumb-size-group">
            <button type="button" data-size="s" class="thumb-size-btn" title="小尺寸">小</button>
            <button type="button" data-size="m" class="thumb-size-btn" title="中尺寸">中</button>
            <button type="button" data-size="l" class="thumb-size-btn" title="大尺寸">大</button>
          </div>
        </div>
        <div id="browse-area" class="browse-area">
          <div id="empty-tip" class="empty hidden">请选择左侧目录，或点击套图浏览图片</div>
          <div id="folder-grid" class="folder-grid"></div>
          <div id="archive-grid" class="folder-grid archive-grid"></div>
          <div id="image-grid" class="image-grid"></div>
        </div>
        <div id="pagination" class="pagination hidden"></div>
      </section>
    </div>
  </div>

  <div id="favorites-view" class="favorites-view hidden">
    <header class="fav-topbar">
      <button id="fav-back" class="btn-ghost" data-icon="back"></button>
      <span class="fav-title">我的收藏</span>
      <span id="fav-count" class="fav-count"></span>
    </header>
    <div class="fav-body">
      <div id="fav-empty" class="empty hidden">暂无收藏</div>
      <div id="fav-grid" class="image-grid masonry"></div>
    </div>
  </div>

  <div id="lightbox" class="lightbox hidden">
    <div class="lightbox-stage">
      <img id="lb-img" alt="">
      <div id="lb-video-wrap" class="video-wrap hidden">
        <video id="lb-video" playsinline></video>
        <div class="video-controls">
          <button id="vc-play" class="vc-btn" title="播放/暂停" data-icon="play"></button>
          <input type="range" id="vc-progress" min="0" max="1000" value="0" step="1" title="进度">
          <span id="vc-time" class="vc-time">0:00 / 0:00</span>
          <button id="vc-mute" class="vc-btn" title="静音" data-icon="volume"></button>
          <input type="range" id="vc-volume" min="0" max="100" value="100" step="1" title="音量">
          <button id="vc-pip" class="vc-btn" title="小窗画中画" data-icon="fullScreen"></button>
          <button id="vc-fullscreen" class="vc-btn" title="浏览器全屏" data-icon="fullScreen"></button>
          <button id="vc-close" class="vc-btn" title="关闭" data-icon="closeSmall"></button>
        </div>
      </div>
    </div>
    <button id="lb-close" class="lb-corner-btn lb-close" title="返回" data-icon="back"></button>
    <span id="lb-counter" class="lb-counter"></span>
    <button id="lb-zoom-toggle" class="lb-corner-btn lb-zoom-toggle" title="放大到原始大小"><span id="lb-zoom-ico" data-icon="zoomIn"></span></button>
    <button id="lb-fav" class="lb-corner-btn lb-fav" title="收藏" data-icon="heart"></button>
    <button id="lb-download" class="lb-corner-btn lb-download" title="下载原图" data-icon="download"></button>
    <button id="lb-info-toggle" class="lb-corner-btn lb-info-toggle" title="详情" data-icon="info"></button>
    <button id="lb-prev" class="lb-nav" title="上一个" data-icon="prev"></button>
    <button id="lb-next" class="lb-nav" title="下一个" data-icon="next"></button>
    <div id="lb-navigator" class="lb-navigator hidden">
      <img id="lb-nav-img" alt="">
      <div id="lb-nav-viewport" class="lb-nav-viewport"></div>
    </div>
    <div id="lb-info-panel" class="lb-info-panel hidden">
      <div class="lb-info-title">图片信息</div>
      <div id="lb-info-body" class="lb-info-body">
        <div id="lb-info-loading" class="lb-info-loading hidden">加载中...</div>
        <div id="lb-info-error" class="lb-info-error hidden"></div>
        <div id="lb-info-fields" class="lb-info-fields"></div>
      </div>
    </div>
  </div>

  <script src="/js/app.js?v=20260816s"></script>
</body>
</html>
